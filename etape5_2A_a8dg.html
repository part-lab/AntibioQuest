<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Antibio Quest</title>
    <link rel="stylesheet" href="style.css">
  </head>
  
  <body>
    <header class="brand">
      <img src="Logo_EPFL.png" alt="EPFL" width="50" />
      <span>Antibio Quest</span>
    </header>

    <!-- ===== Barre de progression ===== -->
    <nav class="progression" id="progression" aria-label="Étapes"></nav>

    <main class="card">
      <h1>Traitement en cours 💊</h1>
      <p class="sub">Votre antibiotique a été produit et utilisé pour traiter un patient 
        en difficulté du Service des maladies infectieuses de l'Hôpital fédéral.<br><br>
        La <b>médecin-cheffe du service, Dr King</b> peut vous dire si votre antibiotique a fonctionné.<br><br> 
      </p>

      <button class="avant" id="btn-avant">Contacter le Dr King</button>
      <p><br></p>
      <div class="hint" id="msg"></div>
      <!-- <a href="etape5_1_ie3t.html" style="text-decoration:none"><button class="arriere" id="btn-arriere">← Retourner</button></a>
    -->
      
      </main>

    <!-- <footer class="copyright">© 2026 EPFL - Service de Promotion des Sciences</footer> -->
  

<!-- ===== SCRIPTS - template ===== -->
    <script>
      var ETAPE_ACTUELLE = 5 ;    // ← 1 à N : etape sur barre de progression
      var MESSAGES_ERREUR = [
        "Trouvez les chargé-es de liaison de l'hôpital pour leur demander le contact du Dr King",
      ];
      var msg = document.getElementById("msg");
      var tour = 0;

      document.getElementById("btn-avant").addEventListener("click", function () {
        msg.textContent = MESSAGES_ERREUR[tour % MESSAGES_ERREUR.length];
        tour++;
      });
    </script>
    <script src="script_barre-progression.js"></script>

    </body>
</html>
