<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Messagerie Dr King</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: Inter, system-ui, sans-serif;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        background: #e5ddd5;
        color: #111827;
      }
      /* ===== Barre de contact (haut) ===== */
      .entete {
        background: #075e54;
        color: #fff;
        padding: 10px 16px;
        display: flex;
        align-items: center;
        gap: 12px;
        position: sticky;
        top: 0;
        z-index: 2;
      }
      .entete .avatar {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: #128c7e;
        color: #fff;
        font-weight: 700;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .entete .infos { flex: 1; }
      .entete .nom { font-weight: 600; font-size: 1rem; }
      .entete .statut { font-size: 0.75rem; opacity: 0.8; }
      .entete .retour { text-decoration: none; color: #fff; font-size: 1.2rem; padding: 0 6px; }
      header.brand {
        background: #075e54;
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 0.8rem;
        opacity: 0.85;
        color: #fff;
        padding: 4px 16px 0;
      }
      header.brand img { width: 22px; height: 22px; border-radius: 6px; }
      /* ===== Zone de messages ===== */
      .messages {
        flex: 1;
        overflow-y: auto;
        padding: 20px 10% 10px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        background:
          radial-gradient(circle at 20% 30%, rgba(255,255,255,0.4) 0 2px, transparent 3px),
          radial-gradient(circle at 70% 60%, rgba(255,255,255,0.4) 0 2px, transparent 3px),
          #efe7de;
        min-height: 60vh;
      }
      .message {
        max-width: 85%;
        padding: 8px 12px;
        border-radius: 10px;
        font-size: 0.82rem;
        line-height: 1.4;
        position: relative;
        box-shadow: 0 1px 1px rgba(0, 0, 0, 0.12);
        word-wrap: break-word;
      }
      .message .heure {
        display: block;
        font-size: 0.65rem;
        opacity: 0.6;
        text-align: right;
        margin-top: 3px;
      }
      .message.recu {
        align-self: flex-start;
        background: #fff;
        border-top-left-radius: 2px;
      }
      .message.envoye {
        align-self: flex-end;
        background: #dcf8c6;
        border-top-right-radius: 2px;
      }
      .message .meta { float: right; margin-left: 8px; }
      .lu { color: #34b7f1; }
      /* ===== Indicateur « en train d'écrire » ===== */
      .message.encours {
        background: #fff;
        padding: 12px 16px 8px;
      }
      .message.encours .points {
        display: inline-flex;
        gap: 4px;
        align-items: center;
      }
      .message.encours .points span {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #9ca3af;
        animation: rebond 1.2s infinite;
      }
      .message.encours .points span:nth-child(2) { animation-delay: 0.2s; }
      .message.encours .points span:nth-child(3) { animation-delay: 0.4s; }
      @keyframes rebond {
        0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
        30% { transform: translateY(-4px); opacity: 1; }
      }
    </style>
  </head>
  <body>
    <header class="brand">

    </header>
    <div class="entete">
      
      <div class="avatar">S</div>
      <div class="infos">
        <div class="nom">Dr Santos</div>
        <div class="statut">en ligne</div>
      </div>
    </div>

    <main class="messages" id="messages"></main>

    

    <script>
      // ====== RÉGLAGES ======
      var NOM_CONTACT = "Dr Santos";
      var AVATAR_CONTACT = "S";
      var PAGE_RETOUR = "page1.html"; // utilisée par la flèche ← (aussi dans le href ci-dessus)

      // Message initial affiché immédiatement (côté : "recu" ou "envoye")
      var MESSAGE_INITIAL = { cote: "envoye", texte: "Bonjour Dr Santos, comment va la patiente qui a pris l'antibiotique que nous avons développé et produit ?" };

      // Réponses automatiques du destinataire, en 3 messages successifs
      var REPONSES = [
        "Bonjour ! Tout d'abord, merci pour tout votre travail.",
        "L'état de la patiente s'est malheureusement aggravé depuis qu'elle prend cet antibiotique.",
        "J'ai décidé d'interrompre le traitement pour le moment.",
        "Pouvez-vous reprendre vos recherches pour nous proposer une nouvelle molécule ?"
      ];
      var TEMPS_ECRITURE = 3000; // ← durée de l'indicateur « … » avant chaque réponse (ms)
      var PAUSE_ENTRE_MESSAGES = 800; // ← pause entre deux messages (ms)

      // ====== Affichage ======
      var zone = document.getElementById("messages");

      function heure() {
        var d = new Date();
        return d.getHours().toString().padStart(2, "0") + ":" +
               d.getMinutes().toString().padStart(2, "0");
      }

      function ajouterMessage(cote, texte) {
        var el = document.createElement("div");
        el.className = "message " + cote;
        el.textContent = texte;
        var h = document.createElement("span");
        h.className = "heure";
        h.textContent = heure();
        if (cote === "envoye") {
          var coches = document.createElement("span");
          coches.className = "meta lu";
          coches.textContent = "✓✓";
          el.appendChild(coches);
        }
        el.appendChild(h);
        zone.appendChild(el);
        zone.scrollTop = zone.scrollHeight;
      }

      function ajouterIndicateurEcriture() {
        if (document.querySelector(".message.encours")) return;
        var el = document.createElement("div");
        el.className = "message recu encours";
        el.innerHTML = '<span class="points"><span></span><span></span><span></span></span>';
        zone.appendChild(el);
        zone.scrollTop = zone.scrollHeight;
      }

      function retirerIndicateurEcriture() {
        var el = document.querySelector(".message.encours");
        if (el) el.remove();
      }

      // ====== Déroulé automatique ======
      ajouterMessage(MESSAGE_INITIAL.cote, MESSAGE_INITIAL.texte);

      function jouerReponse(i) {
        if (i >= REPONSES.length) return; // séquence terminée
        setTimeout(function () {
          ajouterIndicateurEcriture();          // « … » : le destinataire écrit
          setTimeout(function () {
            retirerIndicateurEcriture();
            ajouterMessage("recu", REPONSES[i]); // la réponse tombe
            jouerReponse(i + 1);                  // enchaîne sur la suivante
          }, TEMPS_ECRITURE);
        }, PAUSE_ENTRE_MESSAGES);
      }

      jouerReponse(0);
    </script>
  </body>
</html>
